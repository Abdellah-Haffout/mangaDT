name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Select Xcode 16
        run: |
          XCODE_16=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_16" ]; then
            echo "Switching to $XCODE_16"
            sudo xcode-select -s "$XCODE_16/Contents/Developer"
          fi
          xcodebuild -version

      - name: Build Shared Kotlin Multiplatform Framework
        run: |
          ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64

      - name: Build iOS App (Archive / Release)
        run: |
          cd iosApp
          xcodebuild clean build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="../build/ios-output"

      - name: Package Application (.zip / .ipa)
        run: |
          mkdir -p build/artifacts
          APP_PATH=$(find build/ios-output -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            mkdir -p build/Payload
            cp -R "$APP_PATH" build/Payload/
            cd build
            zip -r artifacts/MangaDT.ipa Payload
            zip -r artifacts/MangaDT.app.zip Payload/*.app
            cd ..
            ls -la build/artifacts
          else
            echo "Error: .app not found in build/ios-output"
            find build/ios-output || true
            exit 1
          fi

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaDT-iOS
          path: build/artifacts/*
          retention-days: 14
