name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Shared Kotlin Multiplatform Framework
        run: |
          ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Build iOS App (Archive / Release)
        run: |
          cd iosApp
          xcodebuild clean build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="../build/ios-output"

      - name: Package Application (.zip / .ipa)
        run: |
          mkdir -p build/artifacts
          APP_PATH=$(find build/ios-output -name "MangaDT.app" -type d | head -n 1)
          if [ -d "$APP_PATH" ]; then
            echo "Found app at $APP_PATH"
            # Create Payload folder for standard IPA packaging
            mkdir -p build/Payload
            cp -R "$APP_PATH" build/Payload/
            cd build
            zip -r artifacts/MangaDT-unsigned.ipa Payload
            zip -r artifacts/MangaDT.app.zip $(basename "$APP_PATH")
            cd ..
          else
            echo "Error: MangaDT.app not found"
            exit 1
          fi

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaDT-iOS
          path: build/artifacts/*
          retention-days: 14
